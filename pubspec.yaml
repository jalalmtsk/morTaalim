          weight: 300
        - asset: assets/fonts/Fredoka/Fredoka_SemiCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka/Fredoka_SemiCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka/Fredoka_SemiCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka/Fredoka_SemiCondensed-Bold.ttf
          weight: 700

    # ── Fredoka SemiExpanded ──────────────────────────────────────
    - family: Fredoka_SemiExpanded
      fonts:
        - asset: assets/fonts/Fredoka/Fredoka_SemiExpanded-Light.ttf
          weight: 300
        - asset: assets/fonts/Fredoka/Fredoka_SemiExpanded-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka/Fredoka_SemiExpanded-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka/Fredoka_SemiExpanded-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka/Fredoka_SemiExpanded-Bold.ttf
          weight: 700

    # ── Fredoka Expanded ──────────────────────────────────────────
    - family: Fredoka_Expanded
      fonts:
        - asset: assets/fonts/Fredoka/Fredoka_Expanded-Light.ttf
          weight: 300
        - asset: assets/fonts/Fredoka/Fredoka_Expanded-Regular.ttf
          weight: 400
