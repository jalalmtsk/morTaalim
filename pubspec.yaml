name: mortaalim
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.9+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  youtube_player_flutter: ^9.1.1
  connectivity_plus: ^6.1.4
  just_audio: ^0.10.4
  confetti: ^0.8.0
  shimmer: ^3.0.0
  flutter_tts: ^4.2.3
  provider: ^6.1.5
  animated_text_kit: ^4.2.3
  url_launcher: ^6.3.1
  package_info_plus: ^8.3.0
  flutter_launcher_icons: ^0.14.4
  lottie: ^3.3.1
  fl_chart: ^0.71.0
  flutter_colorpicker: ^1.1.0
  google_mobile_ads: ^6.0.0
  percent_indicator: ^4.2.5
  in_app_purchase: ^3.3.0
  font_awesome_flutter: ^11.0.0
  flutter_staggered_animations: ^1.1.1
  cloud_firestore: ^6.0.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  uuid: ^4.5.1
  hive: ^2.2.3
  flutter_keyboard_visibility: ^6.0.0
  marquee: ^2.3.0
  share_plus: ^11.1.0
  firebase_database: ^12.0.0
  network_info_plus: ^6.1.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/MoorTaalimLogo.png"
  min_sdk_android: 21
  adaptive_icon_foreground: "assets/icons/MoorTaalimLogo.png"
  adaptive_icon_background: "#ffffff"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/courses/
    - assets/courses/primaire1/Primaire1Cours/
    - assets/courses/primaire2/Primaire2Cours/
    - assets/images/
    - assets/images/Sketches/
