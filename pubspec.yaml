    # ── Fredoka font folder (required for asset bundling) ─────────
    - assets/fonts/Fredoka/
    - assets/animations/
    - assets/animations/AnimatedAvatars/
    - assets/animations/QuizzGame_Animation/
    - assets/animations/LvlUnlocked/
    - assets/animations/UIBannerAnimations/
    - assets/animations/FirstTouchAnimations/
    - assets/animations/UI_Animations/
    - assets/animations/PetAnimations/
    - assets/animations/TutorielGesture/

  fonts:
    # ── Fredoka (standard width) ──────────────────────────────────
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka/Fredoka-Light.ttf
          weight: 300
        - asset: assets/fonts/Fredoka/Fredoka-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fredoka/Fredoka-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fredoka/Fredoka-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fredoka/Fredoka-Bold.ttf
          weight: 700

    # ── Fredoka Condensed ─────────────────────────────────────────
    - family: Fredoka_Condensed
      fonts:
        - asset: assets/fonts/Fredoka/Fredoka_Condensed-Light.ttf
          weight: 300
        - asset: assets/fonts/Fredoka/Fredoka_Condensed-Regular.ttf
