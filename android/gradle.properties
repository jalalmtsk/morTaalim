# JVM Arguments - Optimized for modern development
org.gradle.jvmargs=-Xmx8G -Xms2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=./build/heap-dump.hprof -XX:+UseG1GC -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true

# Jetifier - disable if your dependencies are all AndroidX-native
android.enableJetifier=false

# Gradle performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.daemon=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.java=true
kotlin.daemon.jvm.options=-Xmx4G -XX:MaxMetaspaceSize=512m

# R8/D8 compiler
android.enableR8.fullMode=true

# Build features - disable unused ones to speed up builds
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false